[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predicate-state-machine-executor"
version = "0.1.0"
description = "Deterministic finite state machine executor driven by symbolic predicate guards for mission-critical agent workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
predicate-state-machine-executor = "predicate_state_machine_executor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["predicate_state_machine_executor*"]
